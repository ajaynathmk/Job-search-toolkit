<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job tracker</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/assets/app.css">
<script>
  // set the theme before first paint so the page never flashes the wrong one
  try { var t = JSON.parse(localStorage.getItem("theme")); document.documentElement.setAttribute("data-theme", t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="brand"><span class="brand-mark">J</span>Job tracker</div>
    <nav id="nav"></nav>
    <div class="nav-foot">
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu" aria-label="Open the menu">☰</button>
      <div id="title" style="display:flex;align-items:baseline;gap:12px;min-width:0"></div>
      <div class="spacer"></div>
      <button class="search-trigger" id="search-trigger" aria-label="Search everything"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search everything</span><kbd>Ctrl K</kbd></button>
      <div id="live" class="live"></div>
      <button class="icon-btn" id="theme" aria-label="Switch theme"></button>
    </header>
    <main class="page" id="view" aria-live="polite"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Details" aria-hidden="true"></aside>
<div class="palette" id="palette" role="dialog" aria-label="Search and commands"><input type="text" placeholder="Search roles, thesis topics, pages and commands..." aria-label="Search"><ul role="listbox"></ul></div>
<div class="toast" id="toast" role="status"></div>
<script src="/assets/app.js"></script>
</body>
</html>
